apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  labels:
    app: app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      # The app never calls the Kubernetes API, so it gets no API token.
      # (Radar Checks: "Service account token auto-mount".)
      automountServiceAccountToken: false
      # Prefer one replica per node, so losing a node does not take both.
      # ScheduleAnyway keeps a rollout from blocking on a full node.
      # (Radar Checks: "Missing topology spread constraints".)
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: app
      containers:
        - name: app
          image: app
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: TEAM_NAME
              value: "samba-stack-overflow"
            - name: DEPLOY_ENV
              value: "hackathon"
            # Credentials live in the Secret "app-credentials", created by hand
            # in the cluster (see README). Only its name is in git, never a key.
            - name: ELASTICSEARCH_URL
              valueFrom:
                secretKeyRef:
                  name: app-credentials
                  key: elasticsearch-url
            - name: ELASTICSEARCH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: app-credentials
                  key: elasticsearch-api-key
            - name: DASH0_OTLP_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: app-credentials
                  key: dash0-otlp-endpoint
            - name: DASH0_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: app-credentials
                  key: dash0-auth-token
            - name: DASH0_RUM_TOKEN
              valueFrom:
                secretKeyRef:
                  name: app-credentials
                  key: dash0-rum-token
                  optional: true
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: app-credentials
                  key: openai-api-key
                  optional: true
            # Needed to flip the practice-incident switch. Without it the switch
            # stays locked on this deployment.
            - name: OPS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: app-credentials
                  key: ops-token
                  optional: true
            # Tell Dash0 which pod, namespace and deployment each span came from.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "k8s.pod.name=$(POD_NAME),k8s.namespace.name=$(POD_NAMESPACE),k8s.node.name=$(NODE_NAME),k8s.deployment.name=app,k8s.container.name=app"
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 384Mi
          # Ready only once the Elasticsearch index exists and is seeded.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 3
          # Liveness never touches Elasticsearch: an outage there must not
          # restart healthy pods.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          # A fresh pod needs about 3s to open its port and, measured in Dash0,
          # up to 3s more to warm up: the first connection to Elasticsearch
          # alone took 2.7s. Probing earlier logged Warning events on healthy
          # rollouts (startup "connection refused" at 0s delay, then readiness
          # 503 at 5s; both seen in Radar). 8s clears the measured warm-up.
          # A slower start is still fine: readiness simply waits for it.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 8
            periodSeconds: 2
            failureThreshold: 30
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
