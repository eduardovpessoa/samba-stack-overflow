# Argo CD deploys this folder to your team's namespace. The GitHub Action
# sets the image below on every push to main; don't edit newName or newTag
# by hand.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: team-samba-stack-overflow
resources:
  - deployment.yaml
  - pdb.yaml
  - service.yaml
  - httproute.yaml
images:
  - name: app
    newName: ghcr.io/eduardovpessoa/samba-stack-overflow
    newTag: 1c322ff
